# Minimal, auditerbar CI for pull requests (PR #81 review-runde 3).
# Kører KUN test, typecheck, lint og build på PR'ens kode.
#   - Ingen secrets, ingen miljøvariabler med credentials, ingen production-
#     adgang, ingen deploy (Vercel håndterer preview-deploys separat).
#   - Mindst mulige permissions: kun læseadgang til repoets indhold.
#   - Actions er pinnet til commit-SHA (supply-chain-værn); tag i kommentaren.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
